name: Build debug APK

on:
  push:
    branches:
      - main
      # Development branch: lets every phase be verified in Actions before it is merged.
      - claude/utsav-lens-phase-0-ufwxd1
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release that carries the APK

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Repo hygiene (no secrets, wrapper executable)
        run: |
          set -e
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          if git ls-files | grep -E '(^|/)local\.properties$|\.jks$|\.keystore$|\.p12$|\.pem$'; then
            echo "Forbidden file committed"; exit 1
          fi
          # The three strings.xml files are generated from one table, so en/hi/mr cannot drift apart.
          python3 tools/gen_strings.py
          git diff --exit-code -- app/src/main/res/values/strings.xml app/src/main/res/values-hi/strings.xml app/src/main/res/values-mr/strings.xml
          # Data-integrity guards: raw file writes only in the three reviewed places, and the only
          # code that can delete media is MediaStoreWriter (which refuses anything outside our album).
          bad=$(grep -rnE 'FileOutputStream\(|\.writeText\(|\.writeBytes\(|FileWriter\(|openOutputStream\(|openFileDescriptor\(|RandomAccessFile\(|\.outputStream\(\)' --include=*.kt */src/main \
            | grep -vE 'core/src/main/kotlin/com/utsavlens/core/io/AtomicFileWriter.kt|platform/src/main/java/com/utsavlens/platform/MediaStoreWriter.kt|engine-local/src/main/java/com/utsavlens/engine/local/ModelDownloader.kt|AtomicFileWriter\.' || true)
          if [ -n "$bad" ]; then echo "File write outside the atomic writer:"; echo "$bad"; exit 1; fi
          bad=$(grep -rnE 'esolver\.delete\(' --include=*.kt */src/main | grep -v 'platform/src/main/java/com/utsavlens/platform/MediaStoreWriter.kt' || true)
          if [ -n "$bad" ]; then echo "Media delete outside MediaStoreWriter:"; echo "$bad"; exit 1; fi
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,}' -- . ; then
            echo "Possible API key committed"; exit 1
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew test --continue --stacktrace --console=plain 2>&1 | tee test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          echo "===== ERROR SUMMARY ====="
          cat test.log build.log 2>/dev/null \
            | grep -E '^e: |error:|What went wrong|Could not (resolve|find|get)|Unresolved reference|AAPT|Execution failed|> Task .* FAILED' \
            | sed -e "s#file://$GITHUB_WORKSPACE/##" -e "s#$GITHUB_WORKSPACE/##" | cut -c1-320 | awk '!seen[$0]++' | head -45 || true
          echo "===== FAILED TESTS ====="
          grep -rlE '<(failure|error) ' --include='TEST-*.xml' . 2>/dev/null | head -8 | while read f; do
            echo "--- $f"; grep -E -B1 -A7 '<(failure|error) ' "$f" | cut -c1-320 | head -30
          done || true
          echo "===== END ====="

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/UtsavLens-debug-${{ github.run_number }}.apk"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: UtsavLens-debug-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Utsav Lens debug build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            Debug APK built by GitHub Actions from `${{ github.ref_name }}` at `${{ github.sha }}`.
            Debug-signed with a per-run key: uninstall the previous build before installing this one.
          files: dist/*.apk

      - name: Schema status (empty = committed schema matches the generated one)
        if: always()
        run: |
          git status --porcelain data/schemas | head -3
          if [ -n "$(git status --porcelain data/schemas)" ]; then
            find data/schemas -name '*.json' | while read g; do echo "=== SCHEMA $g"; tr -d '\n' < "$g" | sed 's/  */ /g' | cut -c1-7000; echo; done
          fi
